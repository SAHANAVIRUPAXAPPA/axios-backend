server:
  port: 8080

spring:
  application:
    name: axios-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/axios_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

axios:
  api-keys:
    user: USER-123-KEY
    bank: BANK-456-KEY
    internal: INTERNAL-789-KEY
